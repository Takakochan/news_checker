---
- name: Bootstrap deploy user
  hosts: hetzner
  remote_user: root
  gather_facts: true

  tasks:
    - name: Create deploy user
      ansible.builtin.user:
        name: "{{ deploy_user }}"
        shell: /bin/bash
        groups: sudo
        append: true
        create_home: true

    - name: Allow deploy user passwordless sudo
      ansible.builtin.copy:
        dest: "/etc/sudoers.d/90-{{ deploy_user }}"
        content: "{{ deploy_user }} ALL=(ALL) NOPASSWD:ALL\n"
        mode: "0440"
        validate: "visudo -cf %s"

    - name: Install deploy user's SSH key
      ansible.posix.authorized_key:
        user: "{{ deploy_user }}"
        key: "{{ lookup('file', ssh_public_key_path) }}"
        state: present

- name: Harden SSH, configure firewall and auto-updates, install k3s
  hosts: hetzner
  remote_user: "{{ deploy_user }}"
  become: true
  gather_facts: true

  tasks:
    - name: Disable SSH password authentication
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?\s*PasswordAuthentication'
        line: 'PasswordAuthentication no'
      notify: Restart sshd

    - name: Disable SSH root login
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?\s*PermitRootLogin'
        line: 'PermitRootLogin no'
      notify: Restart sshd

    - name: Flush handlers so SSH hardening is applied before continuing
      ansible.builtin.meta: flush_handlers

    - name: Install ufw and unattended-upgrades
      ansible.builtin.apt:
        name:
          - ufw
          - unattended-upgrades
        state: present
        update_cache: true

    - name: Set ufw default policy (deny incoming, allow outgoing)
      community.general.ufw:
        direction: "{{ item.direction }}"
        policy: "{{ item.policy }}"
      loop:
        - { direction: incoming, policy: deny }
        - { direction: outgoing, policy: allow }

    - name: Allow SSH/HTTP/HTTPS through ufw
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop:
        - "22"
        - "80"
        - "443"

    - name: Enable ufw
      community.general.ufw:
        state: enabled

    - name: Enable unattended security upgrades
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
        mode: "0644"

    - name: Check whether k3s is already installed
      ansible.builtin.stat:
        path: /usr/local/bin/k3s
      register: k3s_bin

    - name: Install k3s
      ansible.builtin.shell: curl -sfL https://get.k3s.io | sh -
      when: not k3s_bin.stat.exists

    - name: Wait for k3s node to be Ready
      ansible.builtin.command: k3s kubectl get node -o jsonpath='{.items[0].status.conditions[?(@.type=="Ready")].status}'
      register: k3s_ready
      until: k3s_ready.stdout == "True"
      retries: 10
      delay: 5
      changed_when: false

  handlers:
    - name: Restart sshd
      ansible.builtin.service:
        name: ssh
        state: restarted
