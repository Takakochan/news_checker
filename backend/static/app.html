<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="News Checker"/>
<title>News Checker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light dark;
    --ink: #1c2321;
    --ink-soft: #4b5754;
    --paper: #faf7f0;
    --card: #ffffff;
    --line: #e2dfd3;
    --accent: #0f6b5c;
    --accent-ink: #ffffff;
    --accent-soft: #e4efe9;
    --low-bg: #e5f3e9; --low-fg: #1e6b3c;
    --med-bg: #fbecd7; --med-fg: #8a5a00;
    --high-bg: #fbe4e1; --high-fg: #b23223;
    --error-bg: #fbe4e1; --error-fg: #b23223;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #f1efe8;
      --ink-soft: #b9c2bd;
      --paper: #14181a;
      --card: #1d2324;
      --line: #303735;
      --accent: #4fbfa5;
      --accent-ink: #0b1211;
      --accent-soft: #223530;
      --low-bg: #1c3324; --low-fg: #7fd89b;
      --med-bg: #3a2c10; --med-fg: #f0b64c;
      --high-bg: #3a1e1a; --high-fg: #f19488;
      --error-bg: #3a1e1a; --error-fg: #f19488;
    }
  }
  :root[data-theme="dark"] {
    --ink: #f1efe8;
    --ink-soft: #b9c2bd;
    --paper: #14181a;
    --card: #1d2324;
    --line: #303735;
    --accent: #4fbfa5;
    --accent-ink: #0b1211;
    --accent-soft: #223530;
    --low-bg: #1c3324; --low-fg: #7fd89b;
    --med-bg: #3a2c10; --med-fg: #f0b64c;
    --high-bg: #3a1e1a; --high-fg: #f19488;
    --error-bg: #3a1e1a; --error-fg: #f19488;
  }

  * { box-sizing: border-box; }
  body {
    font-family: "Source Sans 3", -apple-system, BlinkMacSystemFont, sans-serif;
    max-width: 640px;
    margin: 0 auto;
    padding: 20px;
    padding-top: max(24px, env(safe-area-inset-top));
    padding-bottom: max(32px, env(safe-area-inset-bottom));
    color: var(--ink);
    background: var(--paper);
    font-size: 17px;
    line-height: 1.5;
  }

  header { margin-bottom: 24px; }
  h1 {
    font-family: "Source Serif 4", Georgia, serif;
    font-size: 30px;
    font-weight: 700;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }
  .tagline {
    color: var(--ink-soft);
    font-size: 16px;
    margin: 0;
  }

  .field-label {
    display: block;
    font-weight: 600;
    font-size: 15px;
    margin-bottom: 8px;
    color: var(--ink);
  }

  textarea {
    width: 100%;
    min-height: 150px;
    font-size: 18px;
    line-height: 1.5;
    padding: 14px;
    border-radius: 14px;
    border: 2px solid var(--line);
    box-sizing: border-box;
    -webkit-appearance: none;
    resize: vertical;
    font-family: inherit;
    background: var(--card);
    color: var(--ink);
  }
  textarea:focus {
    outline: none;
    border-color: var(--accent);
  }
  textarea::placeholder { color: var(--ink-soft); opacity: 0.8; }

  button#submit {
    width: 100%;
    margin-top: 14px;
    padding: 17px;
    font-size: 19px;
    font-weight: 700;
    font-family: inherit;
    border: none;
    border-radius: 14px;
    background: var(--accent);
    color: var(--accent-ink);
    cursor: pointer;
    transition: opacity 0.15s ease;
  }
  button#submit:active { opacity: 0.85; }
  button#submit:disabled { opacity: 0.55; cursor: default; }
  button#submit:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .hint {
    margin-top: 10px;
    font-size: 14px;
    color: var(--ink-soft);
  }

  #result:empty { display: none; }

  .block {
    margin-top: 18px;
    padding: 18px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
  }

  .badge {
    display: inline-block;
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 15px;
    font-weight: 700;
  }
  .badge.low { background: var(--low-bg); color: var(--low-fg); }
  .badge.medium { background: var(--med-bg); color: var(--med-fg); }
  .badge.high { background: var(--high-bg); color: var(--high-fg); }

  .reasoning {
    margin-top: 10px;
    color: var(--ink-soft);
    font-size: 15px;
  }

  .label {
    font-family: "Source Serif 4", Georgia, serif;
    font-weight: 700;
    font-size: 20px;
    margin: 0 0 10px;
    color: var(--ink);
  }

  .summary-text {
    font-size: 17px;
    line-height: 1.6;
  }

  .source {
    padding: 14px 0;
    border-top: 1px solid var(--line);
  }
  .source:first-of-type { border-top: none; padding-top: 4px; }
  .source-top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
  }
  .source a {
    color: var(--accent);
    text-decoration: none;
    font-weight: 600;
    font-size: 16px;
    word-break: break-word;
  }
  .source a:hover, .source a:active { text-decoration: underline; }
  .score {
    font-size: 13px;
    color: var(--ink-soft);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .excerpt {
    font-size: 15px;
    color: var(--ink-soft);
    margin-top: 6px;
    line-height: 1.5;
  }
  .no-sources { color: var(--ink-soft); font-size: 15px; }

  .error {
    background: var(--error-bg);
    color: var(--error-fg);
    padding: 16px;
    border-radius: 14px;
    margin-top: 18px;
    font-size: 16px;
    font-weight: 500;
  }

  a.result-link {
    display: block;
    text-align: center;
    margin-top: 18px;
    padding: 14px;
    color: var(--accent);
    background: var(--accent-soft);
    text-decoration: none;
    font-weight: 700;
    font-size: 16px;
    border-radius: 14px;
  }

  .spinner {
    display: inline-block;
    width: 18px;
    height: 18px;
    border: 3px solid rgba(255,255,255,0.4);
    border-top-color: currentColor;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
    margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    .spinner { animation: none; }
  }

  .image-row {
    display: flex;
    gap: 10px;
    margin-top: 12px;
  }
  button#pick-image {
    flex: 1;
    padding: 13px;
    font-size: 16px;
    font-weight: 600;
    font-family: inherit;
    border: 2px solid var(--accent);
    border-radius: 14px;
    background: transparent;
    color: var(--accent);
    cursor: pointer;
  }
  button#pick-image:active { background: var(--accent-soft); }
  button#pick-image:disabled { opacity: 0.55; cursor: default; }
  #image-input { display: none; }

  .ocr-status {
    margin-top: 12px;
    padding: 12px 14px;
    background: var(--accent-soft);
    color: var(--accent);
    border-radius: 14px;
    font-size: 15px;
    font-weight: 600;
    display: flex;
    align-items: center;
  }
  .ocr-status[hidden] { display: none; }
</style>
</head>
<body>
  <header>
    <h1>News Checker</h1>
    <p class="tagline">Paste any claim or headline and get a quick, sourced fact check.</p>
  </header>

  <label class="field-label" for="text">Text to check</label>
  <textarea id="text" placeholder="Paste or type the sentence you want to check, for example a headline or a claim from a screenshot."></textarea>

  <div class="image-row">
    <button id="pick-image" type="button">Extract text from a screenshot</button>
  </div>
  <input type="file" id="image-input" accept="image/*"/>
  <div class="ocr-status" id="ocr-status" hidden><span class="spinner"></span><span id="ocr-status-text">Reading text from image...</span></div>

  <button id="submit">Check the facts</button>
  <p class="hint">Tip: tap &ldquo;Extract text from a screenshot&rdquo; and choose a photo, or paste text directly above.</p>

  <div id="result"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.1/tesseract.min.js"></script>
<script>
const BACKEND_URL = "__BACKEND_URL__";
const TOKEN = "__DEMO_TOKEN__";

const textEl = document.getElementById("text");
const submitEl = document.getElementById("submit");
const resultEl = document.getElementById("result");
const pickImageEl = document.getElementById("pick-image");
const imageInputEl = document.getElementById("image-input");
const ocrStatusEl = document.getElementById("ocr-status");
const ocrStatusTextEl = document.getElementById("ocr-status-text");

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

const SEVERITY_LABELS = { low: "Low severity", medium: "Medium severity", high: "High severity" };

async function runCheck() {
  const text = textEl.value.trim();
  if (!text) return;

  submitEl.disabled = true;
  submitEl.innerHTML = `<span class="spinner"></span>Checking...`;
  resultEl.innerHTML = "";

  try {
    const response = await fetch(`${BACKEND_URL}/check`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        Authorization: `Bearer ${TOKEN}`,
      },
      body: JSON.stringify({ text }),
    });
    if (!response.ok) {
      throw new Error(`Server error (${response.status}). Please try again in a moment.`);
    }
    const data = await response.json();
    renderResult(data);
  } catch (err) {
    resultEl.innerHTML = `<div class="error">${escapeHtml(err.message || "Something went wrong. Please check your connection and try again.")}</div>`;
  } finally {
    submitEl.disabled = false;
    submitEl.textContent = "Check the facts";
  }
}

function renderResult(data) {
  const sourcesHtml = (data.sources || [])
    .map(
      (s) => `
      <div class="source">
        <div class="source-top">
          <a href="${escapeHtml(s.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(s.title || s.url)}</a>
          <span class="score">match ${Math.round(s.score * 100)}%</span>
        </div>
        <div class="excerpt">${escapeHtml((s.content || "").slice(0, 160))}...</div>
      </div>`
    )
    .join("");

  resultEl.innerHTML = `
    <div class="block">
      <span class="badge ${data.severity}">${SEVERITY_LABELS[data.severity] || data.severity}</span>
      <div class="reasoning">${escapeHtml(data.severity_reasoning)}</div>
    </div>
    <div class="block">
      <div class="label">Summary</div>
      <div class="summary-text">${escapeHtml(data.summary).replace(/\n/g, "<br/>")}</div>
    </div>
    <div class="block">
      <div class="label">Sources</div>
      ${sourcesHtml || '<div class="no-sources">No sources were found for this claim.</div>'}
    </div>
    <a class="result-link" href="${escapeHtml(data.result_url)}" target="_blank" rel="noopener noreferrer">Open full result page &rarr;</a>
  `;
}

async function runOcr(file) {
  pickImageEl.disabled = true;
  ocrStatusEl.hidden = false;
  ocrStatusTextEl.textContent = "Reading text from image...";

  try {
    const { data } = await Tesseract.recognize(file, "eng", {
      logger: (m) => {
        if (m.status === "recognizing text" && typeof m.progress === "number") {
          ocrStatusTextEl.textContent = `Reading text from image... ${Math.round(m.progress * 100)}%`;
        }
      },
    });
    const extracted = (data.text || "").trim();
    if (!extracted) {
      ocrStatusTextEl.textContent = "No text found in that image. Try pasting the text instead.";
      setTimeout(() => { ocrStatusEl.hidden = true; }, 3000);
      return;
    }
    textEl.value = textEl.value ? `${textEl.value}\n${extracted}` : extracted;
    ocrStatusEl.hidden = true;
  } catch (err) {
    ocrStatusTextEl.textContent = "Couldn't read that image. Try pasting the text instead.";
    setTimeout(() => { ocrStatusEl.hidden = true; }, 3000);
  } finally {
    pickImageEl.disabled = false;
    imageInputEl.value = "";
  }
}

pickImageEl.addEventListener("click", () => imageInputEl.click());
imageInputEl.addEventListener("change", () => {
  const file = imageInputEl.files && imageInputEl.files[0];
  if (file) runOcr(file);
});

submitEl.addEventListener("click", runCheck);
</script>
</body>
</html>
