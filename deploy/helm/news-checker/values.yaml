image:
  repository: ghcr.io/takakochan/news-checker
  tag: latest
  # "latest" is a mutable tag, so the kubelet must re-check the registry every time
  # (otherwise it keeps serving whatever it cached under that tag forever).
  pullPolicy: Always

replicaCount: 0 # TEMP: alert-firing drill, step 6. Revert to 1 after confirming NewsCheckerReplicasUnavailable fires.

containerPort: 8000

service:
  port: 80
  targetPort: 8000

ingress:
  host: 49.13.129.122.nip.io
  clusterIssuer: letsencrypt-prod
  ingressClassName: traefik

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# Supplied at install time with --set, never committed with real values.
secrets:
  nebiusApiKey: ""
  tavilyApiKey: ""
  demoToken: ""
