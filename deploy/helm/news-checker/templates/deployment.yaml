apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "news-checker.fullname" . }}
  labels:
    {{- include "news-checker.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "news-checker.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "news-checker.labels" . | nindent 8 }}
    spec:
      containers:
        - name: news-checker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.containerPort }}
          envFrom:
            - secretRef:
                name: {{ include "news-checker.fullname" . }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.containerPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.containerPort }}
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
