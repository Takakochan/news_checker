apiVersion: v1
kind: Secret
metadata:
  name: {{ include "news-checker.fullname" . }}
  labels:
    {{- include "news-checker.labels" . | nindent 4 }}
type: Opaque
stringData:
  NEBIUS_API_KEY: {{ .Values.secrets.nebiusApiKey | quote }}
  TAVILY_API_KEY: {{ .Values.secrets.tavilyApiKey | quote }}
  DEMO_TOKEN: {{ .Values.secrets.demoToken | quote }}
