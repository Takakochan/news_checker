apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: news-checker
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Takakochan/news_checker.git
    targetRevision: master
    path: deploy/helm/news-checker
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  # The Secret's real values are set once by hand (helm --set from .env) and never
  # committed to git, so its rendered manifest here is always empty. Without this,
  # selfHeal would blow the real secret away on every sync.
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: news-checker-news-checker
      jsonPointers:
        - /data
        - /stringData
