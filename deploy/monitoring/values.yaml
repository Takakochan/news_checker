# Resource-constrained override for prometheus-community/kube-prometheus-stack.
# This VM is a single cx23 (2 vCPU / 4GB), already running k3s + Traefik +
# cert-manager + Argo CD + the app itself, so every component here is trimmed down.

prometheus:
  prometheusSpec:
    retention: 1d
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    # Pick up ServiceMonitors/PrometheusRules cluster-wide regardless of label,
    # instead of requiring them to carry this release's Helm labels.
    serviceMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false

alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - alertmanager.49.13.129.122.nip.io
    paths:
      - /
    tls:
      - secretName: alertmanager-tls
        hosts:
          - alertmanager.49.13.129.122.nip.io

grafana:
  # On this constrained node, Grafana takes longer to start than the chart's
  # default probe timing allows, so kubelet kills it mid-boot before it's ready.
  livenessProbe:
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 10
  readinessProbe:
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 10
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - grafana.49.13.129.122.nip.io
    path: /
    tls:
      - secretName: grafana-tls
        hosts:
          - grafana.49.13.129.122.nip.io

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
